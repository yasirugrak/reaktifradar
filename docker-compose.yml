name: reaktifradar

# Uygulama ve zamanlayıcı aynı kodu ve imajı kullanır.
# PostgreSQL, Redis ve nginx burada tekrar oluşturulmaz.
x-app: &app
  image: reaktifradar/app:prod
  build:
    context: .
    dockerfile: docker/Dockerfile
  working_dir: /var/www/html/reaktifradar
  volumes:
    - .:/var/www/html/reaktifradar
  # Laravel .env dosyasını doğrudan okur; env_file kullanılmaz.
  # Yalnızca konteyner içi bağlantılar ve uygulama izolasyonu sabitlenir.
  environment:
    TZ: Europe/Istanbul
    DB_CONNECTION: pgsql
    DB_HOST: okukid-postgres
    DB_PORT: 5432
    DB_DATABASE: reaktifradar
    REDIS_CLIENT: predis
    REDIS_HOST: okukid-redis
    REDIS_PORT: 6379
    REDIS_DB: ${REAKTIFRADAR_REDIS_DB:-8}
    REDIS_CACHE_DB: ${REAKTIFRADAR_REDIS_CACHE_DB:-9}
    REDIS_PREFIX: "reaktifradar:"
    CACHE_STORE: redis
    CACHE_PREFIX: "reaktifradar:cache:"
    SESSION_COOKIE: reaktifradar_session
    QUEUE_CONNECTION: sync
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  restart: unless-stopped
  networks:
    - internal

services:
  app:
    <<: *app
    container_name: reaktifradar-app
    networks:
      - shared
      - internal

  # Enerjisa kontrolü ve periyodik raporlar bu uygulamanın kodunu çalıştırır.
  # Canlı veri taşıma bitince notifications profiliyle başlatın.
  scheduler:
    <<: *app
    container_name: reaktifradar-scheduler
    command: php artisan schedule:work
    # profiles: [notifications]

# OkuKid önce başlatılmış olmalı. Farklı compose projeleri arasında
# depends_on çalışmaz; mevcut servisler dış ağ üzerinden bulunur.
networks:
  shared:
    external: true
    name: ${SHARED_NETWORK:-yasir_net}
  internal:
    external: true
    name: ${OKUKID_INTERNAL_NETWORK:-okukid_internal}
