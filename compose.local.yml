name: reaktifradar-local
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reaktifradar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: local-radar-only
    volumes:
      - local-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U radar -d reaktifradar']
      interval: 2s
      retries: 20
  app: &local-app
    image: reaktifradar/app:local
    working_dir: /var/www/html/reaktifradar
    volumes:
      - .:/var/www/html/reaktifradar
    ports:
      - '127.0.0.1:8098:8000'
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8098
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: reaktifradar
      DB_USERNAME: radar
      DB_PASSWORD: local-radar-only
      CACHE_STORE: file
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: 'false'
      REAKTIFRADAR_NOTIFICATIONS_ENABLED: 'false'
      MAIL_MAILER: log
      QUEUE_CONNECTION: sync
    depends_on:
      db:
        condition: service_healthy
  scheduler:
    <<: *local-app
    ports: []
    command: php artisan schedule:work
    restart: unless-stopped
volumes:
  local-db:
