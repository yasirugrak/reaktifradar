server {
    listen 80;
    server_name reaktifradar.com www.reaktifradar.com;

    # Sertifika yenileme HTTPS'e yonlendirilmeden once cevaplanmali.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot/;
        allow all;
        default_type "text/plain";
    }

    location / {
        return 301 https://reaktifradar.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.reaktifradar.com;

    ssl_certificate     /etc/nginx/ssl/live/reaktifradar.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/reaktifradar.com/privkey.pem;

    return 301 https://reaktifradar.com$request_uri;
}

server {
    listen 443 ssl;
    server_name reaktifradar.com;

    ssl_certificate     /etc/nginx/ssl/live/reaktifradar.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/reaktifradar.com/privkey.pem;

    root /var/www/html/reaktifradar/public;
    index index.php;

    charset utf-8;

    # İstek boyutu sınırı.
    client_max_body_size 10M;
    client_body_timeout 60s;

    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot/;
        allow all;
        default_type "text/plain";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Livewire 4 uses dynamic /livewire-<hash>/ routes, including JS/CSS.
    # Bypass the static asset regex and let Laravel handle these requests.
    location ^~ /livewire- {
        rewrite ^ /index.php last;
    }

    location ~ \.php$ {
        try_files $uri =404;

        set $reaktifradar_fpm reaktifradar-app:9000;
        fastcgi_pass $reaktifradar_fpm;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # TLS'i nginx sonlandiriyor; uygulamanin bunu bilmesi gerekiyor,
        # yoksa urettigi mutlak adresler http olur.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;

        # Enerjisa sorgularının tamamlanması için zaman tanıyın.
        fastcgi_read_timeout 180;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires max;
        add_header Cache-Control public;
        try_files $uri =404;
    }

    # .env, .git ve digerleri hicbir kosulda servis edilmez.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
